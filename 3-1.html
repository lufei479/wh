<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>420 王赫</title>
</head>
<body>
    <h2>HTML 表单form</h2>

    <!-- 表单外的普通按钮，不在form内部 -->
    <button type="button">表单外按钮</button>
    <hr>

    <form action="http://huanqiu.com" name="yl">
        <p>
            用户名：<input type="text" name="username" placeholder="请输入用户名"><br>
            密码：<input type="password" name="password" placeholder="请输入密码"><br>

            性别：
            <input type="radio" name="gender" value="male" id="male">
            <label for="male">男</label>
            <input type="radio" name="gender" value="female" id="female">
            <label for="female">女</label>
            <input type="radio" name="gender" value="secret" id="secret">
            <label for="secret">保密</label>
            <br>

            爱好：
            <input type="checkbox" name="hobby" value="read" id="read">
            <label for="read">阅读</label>
            <input type="checkbox" name="hobby" value="game" id="game">
            <label for="game">游戏</label>
            <input type="checkbox" name="hobby" value="sport" id="sport">
            <label for="sport">运动</label>
            <input type="checkbox" name="hobby" value="music" id="music">
            <label for="music">音乐</label>
            <br>

            籍贯：
            <select name="nativeplace">
                <option value="">--请选择籍贯--</option>
                <option value="liaoning">辽宁</option>
                <option value="beijing">北京</option>
                <option value="shanghai">上海</option>
                <option value="guangdong">广东</option>
                <option value="jiangsu">江苏</option>
            </select>
            <br>

            出生日期：
            <input type="date" name="birthday">
            <br>

            个人简介：<br>
            <textarea name="intro" rows="5" cols="30" placeholder="请输入个人简介"></textarea>
            <br>

            <!-- 多文件上传 multiple 允许多选文件 -->
            文件上传：<input type="file" name="files" multiple>
            <br><br>

            <!-- 表单内普通按钮 -->
            <input type="button" value="普通按钮">
            <!-- 提交按钮 -->
            <input type="submit" value="提交">
            <!-- 重置按钮 -->
            <input type="reset" value="重置">
        </p>
    </form>
</body>
</html>
