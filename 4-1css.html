<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        h2,h3,p{
            padding:0;
            margin:0;
        }
        #box{
            width: 400px;
            padding: 8px;
            border: 1px solid #ccc;
            font-size: 12px;
            margin: 20px auto;
        }
        #box h3{
            font-size: 16px;
            text-align: center;
            line-height: 33px;
            letter-spacing: 3px;
            color: #036;
        }
        #box p{
            line-height: 150%;
            color: #666;
            text-indent: 2em;
        }
        #box a{
            color: #f11;
            text-decoration: none;
        }
        /* 下面是新增样式，原有代码完全没改动 */
        .xuehao{
            color:blue;
            font-weight:bold;
        }
        .xingming{
            color:#222;
            font-weight:bold;
        }
        .nandu{
            color:red;
            font-weight:bold;
        }
        .zhishidian{
            border:2px solid purple;
            padding:2px;
        }
    </style>
</head>
<body>
    <h2>css进阶</h2>
    <div id="box">
        <h3>CSS那些事</h3>
        <p>
            学号：<span class="xuehao">420</span>，姓名：<span class="xingming">王赫</span>，班级：24004，对于《高级网页设计》课程的难度认知为：<span class="nandu">难</span>,
            这个例子对应的知识点是：<span class="zhishidian">群组选择器，后代选择器，层叠与继承</span>。
            <a href="#">更多>></a>
        </p>
    </div>
</body>
</html>
