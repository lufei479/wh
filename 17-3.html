<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <!-- 姓名：王赫，建立时间：2026-11-02 13:58，模型：GLM-5.3-Flash，功能：商品列表页（fetch 获取 dummyjson 接口数据，点击跳转详情页） -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>17-3 | 商品列表</title>
    <style>
        :root {
            --wh_bg: #f2f5f9;
            --wh_card: #ffffff;
            --wh_ink: #2b3440;
            --wh_sub: #6b7a8c;
            --wh_blue: #2563c4;
            --wh_blue_soft: #e8f0fb;
            --wh_orange: #e67e22;
            --wh_red: #d9483b;
            --wh_code: #1e2430;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px 16px 50px;
            background: var(--wh_bg);
            color: var(--wh_ink);
            font-family: "Microsoft YaHei", system-ui, sans-serif;
        }

        .wh_back {
            display: inline-block;
            margin-bottom: 14px;
            padding: 8px 16px;
            background: #232426;
            color: #fff;
            text-decoration: none;
            font-size: 13px;
            border-radius: 6px;
        }

        .wh_back:hover {
            background: var(--wh_blue);
        }

        .wh_top {
            text-align: center;
            margin-bottom: 24px;
        }

        .wh_top h1 {
            margin: 0 0 8px;
            font-size: 26px;
        }

        .wh_top h1 span {
            color: var(--wh_blue);
        }

        .wh_top p {
            margin: 0;
            color: var(--wh_sub);
            font-size: 14px;
            line-height: 1.8;
        }

        .wh_top code {
            background: var(--wh_code);
            color: #9fd6a9;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 12.5px;
        }

        .wh_panel {
            max-width: 1080px;
            margin: 0 auto;
            background: var(--wh_card);
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 18px;
            box-shadow: 0 3px 12px rgba(43, 52, 64, .06);
        }

        .wh_head_row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 10px;
            margin-bottom: 14px;
        }

        .wh_head_row h2 {
            margin: 0;
            font-size: 17px;
        }

        .wh_head_row h2 small {
            color: var(--wh_sub);
            font-size: 12px;
            font-weight: 400;
        }

        .wh_url_tag {
            font-family: Consolas, monospace;
            font-size: 11.5px;
            background: var(--wh_blue_soft);
            color: var(--wh_blue);
            padding: 3px 8px;
            border-radius: 5px;
            word-break: break-all;
        }

        .wh_btn {
            margin-left: auto;
            padding: 8px 16px;
            border: none;
            border-radius: 7px;
            background: var(--wh_blue);
            color: #fff;
            font-size: 13px;
            cursor: pointer;
            transition: transform .15s ease, opacity .15s ease;
        }

        .wh_btn:hover {
            transform: translateY(-2px);
        }

        .wh_btn:disabled {
            opacity: .5;
            cursor: not-allowed;
            transform: none;
        }

        .wh_goods {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 14px;
        }

        .wh_goods_item {
            display: block;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            padding: 12px;
            background: #fff;
            text-decoration: none;
            color: var(--wh_ink);
            transition: transform .16s ease, border-color .16s ease, box-shadow .16s ease;
        }

        .wh_goods_item:hover {
            transform: translateY(-4px);
            border-color: var(--wh_blue);
            box-shadow: 0 8px 18px rgba(37, 99, 196, .15);
        }

        .wh_goods_item img {
            width: 100%;
            height: 140px;
            object-fit: contain;
            border-radius: 6px;
            background: #f7f9fc;
        }

        .wh_goods_name {
            margin: 8px 0 4px;
            font-size: 13.5px;
            font-weight: 700;
            line-height: 1.4;
            height: 2.8em;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }

        .wh_goods_row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12.5px;
        }

        .wh_price {
            color: var(--wh_orange);
            font-weight: 700;
            font-size: 17px;
        }

        .wh_price::before {
            content: "$";
            font-size: 12px;
        }

        .wh_cate {
            color: var(--wh_sub);
        }

        .wh_rate {
            color: var(--wh_orange);
        }

        .wh_go {
            display: block;
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px dashed #e2e8f0;
            color: var(--wh_blue);
            font-size: 12.5px;
            text-align: center;
        }

        .wh_status {
            margin-top: 12px;
            font-size: 12.5px;
            color: var(--wh_sub);
            display: flex;
            align-items: center;
            gap: 8px;
            min-height: 20px;
        }

        .wh_status.wh_err {
            color: var(--wh_red);
        }

        .wh_spin {
            width: 14px;
            height: 14px;
            border: 2px solid #cfd8e3;
            border-top-color: var(--wh_blue);
            border-radius: 50%;
            animation: wh_rotate .8s linear infinite;
            display: none;
        }

        .wh_spin.wh_on {
            display: inline-block;
        }

        @keyframes wh_rotate {
            to { transform: rotate(360deg); }
        }

        .wh_console {
            max-width: 1080px;
            margin: 18px auto 0;
            padding: 14px;
            background: var(--wh_code);
            border-radius: 10px;
            font-family: Consolas, monospace;
            font-size: 12.5px;
            line-height: 1.8;
            color: #9fd6a9;
            overflow: auto;
            white-space: pre-wrap;
            word-break: break-all;
            min-height: 100px;
        }

        .wh_console .wh_dim {
            color: #8a93a5;
        }

        .wh_console .wh_url {
            color: #7cc4ff;
        }

        .wh_foot {
            max-width: 1080px;
            margin: 24px auto 0;
            text-align: center;
            color: #a4b1c0;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <a class="wh_back" href="./index.html">← 返回首页</a>

    <header class="wh_top">
        <h1>商品<span>列表页</span>（跨页面详情）</h1>
        <p>数据接口：<code>https://dummyjson.com/products?limit=8</code>（响应头带 CORS 许可，可跨域访问）</p>
        <p>点击商品卡片 → 携带 <code>?id=商品ID</code> 跳转到 <b>17-3-detail.html</b> 详情页</p>
    </header>

    <section class="wh_panel">
        <div class="wh_head_row">
            <h2>默认商品列表 <small>8 件商品</small></h2>
            <span class="wh_url_tag">GET /products?limit=8</span>
            <button class="wh_btn" id="wh_list_btn">fetch 重新获取</button>
        </div>
        <div class="wh_goods" id="wh_goods"></div>
        <div class="wh_status" id="wh_list_status"><span class="wh_spin" id="wh_list_spin"></span><span id="wh_list_text">页面加载时自动请求…</span></div>
    </section>

    <div class="wh_console" id="wh_console"><span class="wh_dim">> 网络请求日志将显示在这里…</span></div>

    <footer class="wh_foot">王赫 · 《高级网页设计》课堂实践 · 17-3 商品列表页</footer>

    <script>
        const wh_console = document.getElementById("wh_console");

        function wh_log(wh_msg, wh_isUrl) {
            const wh_time = new Date().toLocaleTimeString("zh-CN", { hour12: false });
            const wh_cls = wh_isUrl ? ' class="wh_url"' : '';
            wh_console.innerHTML = '<span class="wh_dim">[' + wh_time + ']</span> <span' + wh_cls + '>' + wh_msg.replace(/</g, "&lt;") + '</span>\n' + wh_console.innerHTML;
        }

        function wh_loading(wh_on, wh_msg) {
            const wh_spin = document.getElementById("wh_list_spin");
            const wh_text = document.getElementById("wh_list_text");
            wh_spin.classList.toggle("wh_on", wh_on);
            wh_text.textContent = wh_msg;
            wh_text.parentElement.classList.remove("wh_err");
        }

        const wh_list_btn = document.getElementById("wh_list_btn");
        const wh_goods = document.getElementById("wh_goods");

        async function wh_loadList() {
            const wh_url = "https://dummyjson.com/products?limit=8";
            wh_list_btn.disabled = true;
            wh_loading(true, "列表请求中…");
            wh_log("→ GET " + wh_url, true);
            try {
                const wh_res = await fetch(wh_url);
                wh_log("← 状态码 " + wh_res.status + " " + wh_res.statusText);
                const wh_data = await wh_res.json();
                wh_log("← 共 " + wh_data.total + " 件商品，本次返回 " + wh_data.products.length + " 件");
                wh_goods.innerHTML = wh_data.products.map(function (wh_p) {
                    return '<a class="wh_goods_item" href="./17-3-detail.html?id=' + wh_p.id + '">' +
                        '<img src="' + wh_p.thumbnail + '" alt="' + wh_p.title + '">' +
                        '<p class="wh_goods_name">' + wh_p.title + '</p>' +
                        '<div class="wh_goods_row"><span class="wh_price">' + wh_p.price.toFixed(2) + '</span>' +
                        '<span class="wh_cate">' + wh_p.category + '</span></div>' +
                        '<div class="wh_goods_row"><span class="wh_rate">★ ' + wh_p.rating + '</span>' +
                        '<span class="wh_cate">ID: ' + wh_p.id + '</span></div>' +
                        '<span class="wh_go">查看详情 → 17-3-detail.html?id=' + wh_p.id + '</span>' +
                    '</a>';
                }).join("");
                wh_loading(false, "✓ 列表加载成功，点击商品卡片跳转详情页");
                wh_log("✓ 列表渲染完成（8 张商品卡）");
            } catch (wh_e) {
                wh_loading(false, "");
                document.getElementById("wh_list_text").parentElement.classList.add("wh_err");
                document.getElementById("wh_list_text").textContent = "✗ 请求失败：" + wh_e.message;
                wh_log("✗ 失败：" + wh_e.message);
            }
            wh_list_btn.disabled = false;
        }

        wh_list_btn.addEventListener("click", wh_loadList);
        wh_loadList();
    </script>
</body>
</html>
